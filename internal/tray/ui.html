<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ControlZit Agent</title>
<style>
:root {
  --bg: #f4f6fb; --panel: #fff; --panel-2: #f8fafc; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --accent: #4f46e5; --accent-2: #6366f1; --accent-soft: #eef2ff;
  --ok: #16a34a; --ok-soft: #dcfce7; --warn: #d97706; --warn-soft: #fef3c7; --bad: #dc2626; --bad-soft: #fee2e2; --off: #64748b; --off-soft: #f1f5f9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1020; --panel: #111833; --panel-2: #0e1530; --text: #e2e8f0; --muted: #94a3b8; --line: #1f2a4a;
    --accent-soft: #1e1b4b; --ok-soft: #052e16; --warn-soft: #3a2506; --bad-soft: #3b0d0d; --off-soft: #1e293b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
  user-select: none; overflow: hidden; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.name { font-weight: 700; font-size: 16.5px; letter-spacing: -.01em; }
.name span { color: var(--accent-2); }
.sub { color: var(--muted); font-size: 12.5px; }
.conn { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  background: var(--off-soft); color: var(--off); }
.conn i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.conn.on { background: var(--ok-soft); color: var(--ok); }
.conn.on i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
main { flex: 1; overflow: auto; padding: 18px 22px 10px; }
.hero { display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.badge { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--off-soft); color: var(--off); }
.badge svg { width: 28px; height: 28px; }
.hero.on .badge { background: var(--ok-soft); color: var(--ok); }
.hero h1 { margin: 0; font-size: 19px; font-weight: 650; }
.hero p { margin: 2px 0 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 15px; min-width: 0; }
.card b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
.card span { display: block; margin-top: 3px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--off-soft); color: var(--off); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
footer { display: flex; align-items: center; gap: 12px; padding: 10px 22px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); }
footer .sp { flex: 1; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M9 8H23A2 2 0 0 1 25 10V18.5A2 2 0 0 1 23 20.5H9A2 2 0 0 1 7 18.5V10A2 2 0 0 1 9 8ZM10.5 14.5H13L14.6 11.5L17.4 17.5L19 14.5H21.5M16 20.5V24M12 24H20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div><div class="name">Control<span>Zit</span> Agent</div><div class="sub" id="host">&nbsp;</div></div>
  <div class="conn" id="conn"><i></i><span id="connText">…</span></div>
</header>
<main>
  <section class="hero" id="hero">
    <div class="badge" id="badge"></div>
    <div>
      <h1 id="headline" data-t="Loading…">Loading…</h1>
      <p id="detail"></p>
    </div>
  </section>
  <div class="grid">
    <div class="card"><b data-t="Server">Server</b><span id="server">—</span><small id="contact"></small></div>
    <div class="card"><b data-t="Managed by">Managed by</b><span id="customer">—</span><small id="site"></small></div>
    <div class="card"><b data-t="Updates">Updates</b><span id="updates">—</span><small id="updatesSub"></small></div>
  </div>
</main>
<footer>
  <span id="ver"></span>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
let tx = {};
const t = (k, a) => { const s = tx[k] || k; return a === undefined ? s : s.replace(/%[sd]/, a); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icons = {
  on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19v.5M3 3l18 18"/></svg>'
};
function ago(t) {
  if (!t) return "—";
  const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
  if (s < 60) return t("just now");
  if (s < 3600) return t("%d min ago", Math.floor(s / 60));
  if (s < 86400) return t("%d h ago", Math.floor(s / 3600));
  return new Date(t).toLocaleString();
}
function render(s) {
  const on = s.connected && !s.stale;
  $("conn").className = "conn" + (on ? " on" : "");
  $("connText").textContent = on ? t("Connected") : (s.running ? t("Not connected") : t("Agent not running"));
  $("hero").className = "hero" + (on ? " on" : "");
  $("badge").innerHTML = on ? icons.on : icons.off;
  $("headline").textContent = on ? t("This computer is managed and protected") : (s.running ? t("The agent cannot reach the server") : t("The ControlZit Agent service is not running"));
  $("detail").textContent = on ? t("Connected since %s.", new Date(s.since).toLocaleString()) : (s.last_contact ? t("Last contact %s. It keeps trying.", ago(s.last_contact)) : "");
  $("host").textContent = [s.hostname, s.os].filter(Boolean).join(" · ") || " ";
  $("server").textContent = s.server || "—";
  $("contact").textContent = s.last_contact ? t("last contact %s", ago(s.last_contact)) : "";
  $("customer").textContent = s.customer || "—";
  $("site").textContent = s.site || "";
  const u = s.updates;
  if (u && u.scanned_at) {
    $("updates").innerHTML = u.missing === 0 ? '<span class="pill ok">' + esc(t("Up to date")) + "</span>" :
      '<span class="pill ' + (u.security ? "bad" : "warn") + '">' + esc(t("%d missing", u.missing) + (u.security ? ", " + t("%d security", u.security) : "")) + "</span>";
    $("updatesSub").textContent = (s.restart ? t("restart required by %s", new Date(s.restart.deadline).toLocaleString()) + " · " : (u.reboot_required ? t("restart needed") + " · " : "")) + t("checked %s", ago(u.scanned_at));
  } else {
    $("updates").textContent = "—"; $("updatesSub").textContent = u && u.state === "scanning" ? t("searching…") : "";
  }
  $("ver").textContent = t("Agent %s", s.version || "");
}
async function refresh() {
  try { render(await window.czStatus()); } catch (e) { /* the next tick tries again */ }
}
(async () => {
  try { tx = await window.czText(); } catch (e) { /* English */ }
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>

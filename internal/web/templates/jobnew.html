{{template "app" .}}
{{define "content"}}
{{$s := .Data.S}}
<p class="back"><a href="/scripts">{{.T "Script library"}}</a> / <a href="/scripts/{{$s.ID}}">{{$s.Name}}</a></p>
<h1>{{template "icon" "terminal"}}{{.T "Run %s" $s.Name}}</h1>
<form method="post" action="/scripts/{{$s.ID}}/run" class="stack wide" data-confirm="{{.T "Run %s on the selected devices?" $s.Name}}">
  <section class="panel">
    <h2>{{.T "Devices"}}</h2>
    {{template "targets" .}}
    <p class="small muted mt">{{.T "Devices that are offline run the script when they connect, within 24 hours."}}</p>
  </section>
  <div><button class="primary">{{template "icon" "terminal"}}{{.T "Run"}}</button></div>
</form>
{{end}}
